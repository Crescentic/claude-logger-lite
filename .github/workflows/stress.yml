name: Stress test

# Opt-in: run it from the Actions tab. It spawns hundreds of hook processes,
# so it stays out of the normal CI run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: Stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
      - run: npm run stress
