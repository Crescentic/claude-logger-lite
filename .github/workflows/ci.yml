name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest supported Node, the active LTS, and the newest release.
        node: ["22.18.0", "24", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No `npm ci` on purpose: the plugin must run with no installed packages.
      - run: npm test

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  validate:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install -g @anthropic-ai/claude-code
      # The package downloads its native binary in a postinstall step, which
      # newer npm versions can skip; run it explicitly.
      - run: node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
      - run: claude --version
      - run: claude plugin validate .
