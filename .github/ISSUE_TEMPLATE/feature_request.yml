name: Feature request
description: Suggest something the logger should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Would this record anything new (prompts, output, file contents)? If so, should it be opt-in?
